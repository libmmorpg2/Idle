<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rampage: idle rpg</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Philosopher:wght@400;700&family=Exo+2:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/style.css">
<script src="js/i18n/i18n.js"></script>
<script src="js/i18n/en.js"></script>
</head>
<body>
<div class="loader" id="loader" role="status" aria-live="polite">
  <div class="ld-top">
    <h1 class="ld-title">Rampage</h1>
    <div class="ld-sub">idle rpg</div>
  </div>
  <div class="ld-bottom">
    <div class="ld-progress" id="ldProgress">
      <div class="ld-bar"><i id="ldFill"></i></div>
      <div class="ld-status" id="ldStatus">Открываем врата…</div>
    </div>
    <div class="ld-login" id="login" hidden>
      <p>Войдите через Telegram — прогресс будет храниться на сервере и откроется с любого устройства.</p>
      <div id="loginBtn" class="login-btn"></div>
      <small id="loginMsg"></small>
    </div>
    <div class="ld-tip" id="ldTip"></div>
  </div>
</div>
<script>
i18nDom(document.getElementById('loader'));
/* Экран загрузки: работает до загрузки остальных скриптов */
var LOAD=(function(){
  var el=document.getElementById('loader'), fill=document.getElementById('ldFill'), st=document.getElementById('ldStatus'), tip=document.getElementById('ldTip');
  /* Загрузка длится 6–8 с: полоска идёт по времени, но не обгоняет реальную загрузку.
     Пока открыт экран входа через Telegram, отсчёт стоит на паузе. */
  var D=5000+Math.random()*2000, t0=Date.now(), paused=0, pauseAt=0;
  var real=0, shown=0, ready=false, done=false;
  fill.style.transition='none';
  function elapsed(){ return (pauseAt||Date.now())-t0-paused; }
  function tick(){
    if(done) return;
    var x=Math.min(1,elapsed()/D), timeP=100*(1-Math.pow(1-x,1.35));
    shown+=(Math.min(real,timeP)-shown)*0.12; fill.style.width=shown.toFixed(2)+'%';
    if(ready&&x>=1&&shown>99.3){ finish(); return; }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
  function finish(){ done=true; fill.style.width='100%'; st.textContent=T('Готово'); st.classList.remove('err');
    setTimeout(function(){ el.classList.add('out'); clearInterval(tipTimer); window.dispatchEvent(new Event('loaderdone'));
      setTimeout(function(){ if(typeof SPLASH!=="undefined"&&SPLASH) SPLASH.stop(); el.remove(); },700); },120); }
  var TIPS=[T('Герой сражается и без тебя — до 8 часов добычи, пока ты офлайн'),
    T('Зелья дают +20% на 10 минут, а их время складывается до часа'),
    T('Собери 5 книг умения, чтобы попытаться его изучить'),
    T('Заточка поднимает вещь вплоть до +9 — но не всегда удачно'),
    T('Питомцы и плащи дают постоянные бонусы герою'),
    T('Кнопка x2 ускоряет бой вдвое'),
    T('В сумке помещается 200 предметов — не забывай продавать лишнее')];
  var ti=Math.floor(Math.random()*TIPS.length);
  function showTip(){ tip.classList.remove('on'); setTimeout(function(){ tip.textContent=(T('Совет:')+' ')+TIPS[ti++%TIPS.length]; tip.classList.add('on'); },300); }
  showTip(); var tipTimer=setInterval(showTip,4500);
  return {
    set:function(p,text){ if(done) return; real=Math.max(real,p); if(text){ st.textContent=text; st.classList.remove('err'); } },
    error:function(text){ if(done) return; st.textContent=text; st.classList.add('err'); },
    login:function(on){ document.getElementById('login').hidden=!on; document.getElementById('ldProgress').hidden=!!on;
      if(on&&!pauseAt) pauseAt=Date.now(); else if(!on&&pauseAt){ paused+=Date.now()-pauseAt; pauseAt=0; } },
    get open(){ return !done; },
    done:function(){ if(done||ready) return; real=100; ready=true; st.textContent=T('Готовим поле боя…'); st.classList.remove('err'); }
  };
})();
LOAD.set(12);
</script>

<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>
    <div class="hud">
      <div class="hero-card">
        <div class="pic" id="pic"></div>
        <div class="hero-meta">
          <div class="hname" id="hname"></div>
          <div class="lvl"><b>Ур. <span class="num" id="lvl" style="color:var(--fg)">1</span></b><span id="dpsS" class="num bm"></span></div>
          <div class="bar hp"><i id="hpb"></i><b id="hpt"></b></div>
          <div class="bar xp"><i id="xpb"></i><b id="xpt"></b></div>
        </div>
      </div>
      <div class="hud-l"><div class="pot-bar" id="potBar"></div></div>
      <div class="res">
        <div class="wallet">
          <div class="wr wgold" title="Золото"><span class="wi"><span class="coin"></span></span><b id="gold" class="num">0</b></div>
          <div class="wr wstone" title="Осколки души"><span class="wi"><img class="stn" id="stoneIco" alt=""></span><b id="stones" class="num">0</b></div>
          <button class="wr wgram" id="gramChip" aria-label="GRAM"><span class="wi"><img class="gri" id="gramIco" alt=""></span><b id="gramBal" class="num">0</b><i>+</i></button>
        </div>
        <button class="shopb" id="shopBtn"><img data-na="shop" alt=""><span>Магазин</span></button>
      </div>
    </div>
    <div class="zone">
      <h2 id="zname"></h2>
      <div class="pips" id="pips"></div>
      <div class="timer" id="btimer" hidden></div>
    </div>
    <div class="banner" id="banner"></div>
    <div class="chatpanel" id="chatPanel" hidden>
      <div class="chat-head"><div class="chat-tabs" id="chatTabs"></div><span id="chatState"></span><button id="chatClose" aria-label="Закрыть чат">✕</button></div>
      <div class="chat-list" id="chatList"></div>
      <div class="chat-reply" id="chatReply" hidden><span></span><button type="button" aria-label="Отменить ответ">✕</button></div>
      <div class="chat-menu" id="chatMenu" hidden></div>
      <form class="chat-form" id="chatForm"><input id="chatIn" maxlength="140" autocomplete="off" placeholder="Сообщение…" aria-label="Сообщение"><button id="chatSend">➤</button></form>
    </div>
    <div class="controls">
      <button class="chatbar" id="chatBar" aria-label="Открыть чат"><span class="chatico"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M2 2h12v1h1v8h-1v1H7l-3 3v-3H2v-1H1V3h1z"/><path fill="#120d19" d="M4 6h2v2H4zM7 6h2v2H7zM10 6h2v2h-2z"/></svg><i id="chatDot" hidden></i></span><span class="chatlast" id="chatLast"><span class="cm">Чат</span></span></button>
      <div class="skills" id="skills"></div>
      <div class="toggles">
        <button class="tg" id="tgAuto" aria-pressed="true">АВТО</button>
        <button class="tg" id="tgFast" aria-pressed="false">x2</button>
      </div>
    </div>
    <div class="sheet" id="sheet" aria-hidden="true">
      <div class="sheet-head" id="sheetHead"><span class="sp"></span><h2 id="sheetTitle">Герой</h2><button class="sheet-close" id="sheetClose" aria-label="Закрыть">✕</button></div>
    <div class="stats">
      <span>Урон/сек <b id="dps">0</b></span>
      <span>Рекорд <b id="best">1</b></span>
      <div class="mult" id="mult"><button data-m="1" class="on">x1</button><button data-m="10">x10</button><button data-m="0">MAX</button></div>
    </div>
      <div class="list" id="list"></div>
    </div>
    <div class="modal" id="modal" hidden></div>
    <div id="err" hidden style="position:absolute;left:10px;right:10px;top:110px;padding:8px 10px;background:#2a1040;border:1px solid var(--blood);border-radius:6px;font-size:12px;z-index:6"></div>
  </div>
  <nav class="nav" role="tablist">
    <button class="tab on" data-tab="battle" id="tab-battle"><span class="nb"><img data-na="battle" alt=""></span><span class="tl">Бой</span></button>
    <button class="tab" data-tab="hero" id="tab-hero"><span class="nb"><img data-na="hero" alt=""></span><span class="tl">Улучшения</span><i class="dot" id="dot-hero" hidden></i></button>
    <button class="tab" data-tab="skill" id="tab-skill"><span class="nb"><img data-na="skill" alt=""></span><span class="tl">Умения</span><i class="dot" id="dot-skill" hidden></i></button>
    <button class="tab" data-tab="bag" id="tab-bag"><span class="nb"><img data-na="bag" alt=""></span><span class="tl">Сумка</span><i class="dot" id="dot-bag" hidden></i></button>
    <button class="tab" data-tab="map" id="tab-map"><span class="nb"><img data-na="map" alt=""></span><span class="tl">Локации</span></button>
    <button class="tab" data-tab="profile" id="tab-profile"><span class="nb"><img data-na="profile" alt=""></span><span class="tl">Профиль</span><i class="dot" id="dot-profile" hidden></i></button>
  </nav>
    <div class="picker" id="picker" hidden role="dialog" aria-label="Выбор героя">
      <canvas id="pkBg" class="pk-bg"></canvas>
      <button class="pk-x" id="pkClose" aria-label="Закрыть">✕</button>
      <div class="pk-info" id="pkInfo"></div>
      <div class="pk-scene" id="pkScene"><button class="pk-arr" id="pkPrev" aria-label="Предыдущий герой">‹</button><span class="pk-hint">Нажми на героя, чтобы выбрать</span><button class="pk-arr" id="pkNext" aria-label="Следующий герой">›</button></div>
      <button class="pk-go" id="pkGo">Выбрать героя</button>
    </div>
</div>

<script>i18nDom(document.getElementById('app'));LOAD.set(25,T('Загружаем мир…'))</script>
