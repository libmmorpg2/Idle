services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: idle
      POSTGRES_PASSWORD: idle
      POSTGRES_DB: idle
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U idle"]
      interval: 2s
      retries: 15
  app:
    build: .
    environment:
      DATABASE_URL: postgres://idle:idle@db:5432/idle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
